services:
  - type: web
    name: unikon-fashion-learning-studio
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist-site
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: tools=(self)
      - path: /*
        name: Origin-Agent-Cluster
        value: "?1"
